name: Update aurora data

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || true
      - run: npm run update
        env:
          SPACEWEATHER_API_KEY: ${{ secrets.SPACEWEATHER_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "aurora-bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || (git commit -m "Update aurora data" && git push)
